# Control-plane dogfood manifest (dply deploys dply).
# Customer BYO sites use the same processes: schema; supervisor: is Phase-1
# bridge until dply-sv-* programs from WorkerDaemonBackend own the box.
runtime: php

# Phase 1 — role → static template merge into /etc/supervisor/conf.d/dply-platform.conf
# Applied by `dply:self:sync-supervisor` (also from dply:self-horizon-restart).
# Set use_templates: false once processes: → dply-sv-* owns Horizon/scheduler on the box.
supervisor:
  use_templates: true
  conf_d: /etc/supervisor/conf.d
  install_as: dply-platform.conf
  roles:
    worker.primary: deploy/supervisor/dply-worker-primary.conf
    worker.replica: deploy/supervisor/dply-worker.conf
    web: deploy/supervisor/dply-web.conf

# Phase 2 — BYO-style processes (SiteProcess → WorkerDaemonBackend → dply-sv-*).
# While supervisor.use_templates is true, keep Site.meta.process_daemons=false on
# the control-plane worker site so reconcile does not install duplicate systemd units.
processes:
  horizon:
    command: php artisan horizon
    scale: 1
    roles: [worker]
    type: worker
    stopwaitsecs: 3660

  scheduler:
    command: php artisan schedule:work
    roles: [worker:primary]
    type: scheduler
    stopwaitsecs: 60

  warm-images:
    command: php artisan dply:edge:warm-build-images
    roles: [worker]
    oneshot: true

  runtime-check:
    command: php artisan dply:runtime:check --quiet
    roles: [worker]
    loop_seconds: 300
