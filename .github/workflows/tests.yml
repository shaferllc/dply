name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: BYO
            directory: .
          - name: dply-core
            directory: packages/dply-core

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dply_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dply_testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          -c max_locks_per_transaction=512

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: dply_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel application
        if: matrix.directory != 'packages/dply-core'
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run tests (Laravel)
        if: matrix.directory != 'packages/dply-core'
        run: composer test

      # Its own step so a ~45s whole-app parse is not charged to every local
      # `composer test` (which skips it via --exclude-group=arch).
      - name: Run architecture tests
        if: matrix.directory != 'packages/dply-core'
        run: composer test:arch

      - name: Run tests (dply-core)
        if: matrix.directory == 'packages/dply-core'
        run: vendor/bin/phpunit

  cli:
    name: dply-cli (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['18', '22']

    defaults:
      run:
        working-directory: packages/dply-cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Lowest supported version (package.json engines: >=18) plus current LTS:
      # the CLI ships to whatever Node a user already has, so a syntax or API
      # feature newer than 18 has to fail here rather than on their machine.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The package has no dependencies today and therefore no lockfile, so a
      # bare `npm ci` would fail the job. Install only once one exists.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json — nothing to install."
          fi

      - name: Run tests (dply-cli)
        run: npm test
